<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Massive Stock Watchlist</title>
  <style>
    :root {
      --accent: #ff3621;        /* Databricks red */
      --accent-hover: #e02a16;
      --text: #111418;
      --muted: #5f6b7a;
      --border: #e3e8ef;
      --card: #ffffff;
      --radius: 12px;
      --shadow: 0 12px 32px rgba(16, 24, 40, 0.09);
      --ok-bg: #ecfdf5;   --ok-fg: #065f46;   --ok-border: #a7f3d0;
      --err-bg: #fef2f2;  --err-fg: #991b1b;  --err-border: #fecaca;
      --info-bg: #f5f7fa; --info-fg: #374151; --info-border: #e3e8ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #f7f8fa 0%, #edf0f5 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 660px;
      height: fit-content;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      letter-spacing: -0.01em;
      margin: 0 0 8px;
    }
    h1::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: var(--accent);
      flex: none;
    }
    .hint { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 28px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .input-row { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 15px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]::placeholder { color: #9aa4b2; }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 54, 33, 0.12); }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    #result {
      margin-top: 20px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--info-border);
      background: var(--info-bg);
      color: var(--info-fg);
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #result:empty { display: none; }
    #result.success { background: var(--ok-bg);  color: var(--ok-fg);  border-color: var(--ok-border); }
    #result.error   { background: var(--err-bg); color: var(--err-fg); border-color: var(--err-border); }
    table { width: 100%; margin-top: 28px; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: #f9fafb;
    }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: #fafbfc; }
    .symbol-btn {
      padding: 3px 8px;
      border: none;
      border-radius: 6px;
      background: #fff1ef;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .symbol-btn:hover, .symbol-btn:active {
      background: #ffe3df;
      text-decoration: underline;
      transform: none;
    }
    td.price { font-variant-numeric: tabular-nums; font-weight: 600; }
    td.muted { color: var(--muted); font-size: 13px; }
    td.empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 14px; }
    .th-actions, td.actions { width: 56px; text-align: center; }
    td.actions { border-bottom: 1px solid var(--border); }
    .delete-btn {
      padding: 4px 10px;
      border: 1px solid var(--err-border);
      border-radius: 6px;
      background: #fff;
      color: var(--err-fg);
      font-size: 14px;
      line-height: 1.2;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .delete-btn:hover { background: var(--err-bg); border-color: #fca5a5; }
    .delete-btn:disabled { opacity: 0.5; cursor: default; }
    td.history-cell { padding: 0 12px 16px; background: #f9fafb; }
    .history-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; }
    .history-head .up { color: var(--ok-fg); font-weight: 600; }
    .history-head .down { color: var(--err-fg); font-weight: 600; }
    .spark { width: 100%; height: 80px; display: block; }
    @media (max-width: 520px) {
      body { padding: 16px 10px; }
      .card { padding: 20px; }
      .input-row { flex-direction: column; }
      th:nth-child(2), td:nth-child(2) { display: none; } /* hide email column on phones */
    }
  </style>
</head>
<body>
  <main class="card">
  <h1>Stock Watchlist</h1>
  <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

  <form id="stock-form">
    <label for="symbol">Ticker symbol</label>
    <div class="input-row">
      <input type="text" id="symbol" name="symbol" placeholder="e.g. AAPL" autocomplete="off" spellcheck="false" required>
      <button type="submit">Add to watchlist</button>
    </div>
  </form>

  <div id="result"></div>

  <table id="watchlist-table">
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Email</th>
        <th>Latest price</th>
        <th>Updated</th>
        <th class="th-actions" aria-label="Remove"></th>
      </tr>
    </thead>
    <tbody id="watchlist-body"></tbody>
  </table>
  </main>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    let expandedSymbol = null;

    function setResult(message, kind) {
      resultEl.textContent = message;
      resultEl.className = kind || "info";
    }

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          setResult("Error loading watchlist: " + (data.error || resp.statusText), "error");
          return;
        }
        watchlistBody.innerHTML = "";
        expandedSymbol = null;
        if (!data.length) {
          watchlistBody.innerHTML = `<tr><td colspan="5" class="empty">Your watchlist is empty — add your first ticker above.</td></tr>`;
          return;
        }
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td><button type="button" class="symbol-btn" data-symbol="${row.symbol}" title="Show 90-day price history">${row.symbol}</button></td><td>${row.email || "-"}</td><td class="price">${price}</td><td class="muted">${updated}</td><td class="actions"><button type="button" class="delete-btn" data-symbol="${row.symbol}" title="Remove ${row.symbol}" aria-label="Remove ${row.symbol}">&times;</button></td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        setResult("Failed to load watchlist: " + err, "error");
      }
    }

    async function toggleHistory(symbol) {
      const existing = document.getElementById("history-row");
      if (existing) {
        existing.remove();
        if (expandedSymbol === symbol) {
          expandedSymbol = null;
          return;
        }
      }
      const rowBtn = watchlistBody.querySelector(`.symbol-btn[data-symbol="${symbol}"]`);
      if (!rowBtn) return;
      const tr = document.createElement("tr");
      tr.id = "history-row";
      tr.innerHTML = `<td colspan="5" class="history-cell">Loading history for ${symbol}...</td>`;
      rowBtn.closest("tr").after(tr);
      expandedSymbol = symbol;
      try {
        const resp = await fetch(`/history/${encodeURIComponent(symbol)}?days=90`);
        const data = await resp.json();
        if (!resp.ok) {
          tr.innerHTML = `<td colspan="5" class="history-cell">Error: ${data.error || resp.statusText}</td>`;
          return;
        }
        tr.innerHTML = `<td colspan="5" class="history-cell">${renderHistory(symbol, data)}</td>`;
      } catch (err) {
        tr.innerHTML = `<td colspan="5" class="history-cell">Request failed: ${err}</td>`;
      }
    }

    function renderHistory(symbol, bars) {
      if (!Array.isArray(bars) || !bars.length) {
        return `No history data available for ${symbol}.`;
      }
      const closes = bars.map((b) => Number(b.close));
      const min = Math.min(...closes);
      const max = Math.max(...closes);
      const avg = closes.reduce((a, b) => a + b, 0) / closes.length;
      const first = closes[0];
      const last = closes[closes.length - 1];
      const change = ((last - first) / first) * 100;
      const up = change >= 0;
      const w = 560;
      const h = 80;
      const pad = 4;
      const points = closes
        .map((c, i) => {
          const x = pad + (i * (w - 2 * pad)) / Math.max(closes.length - 1, 1);
          const y = h - pad - ((c - min) / Math.max(max - min, 1e-9)) * (h - 2 * pad);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        })
        .join(" ");
      return `
        <div class="history-head">
          <strong>${symbol} — last 90 trading days</strong>
          <span class="${up ? "up" : "down"}">${up ? "+" : ""}${change.toFixed(1)}% · min $${min.toFixed(2)} · max $${max.toFixed(2)} · avg $${avg.toFixed(2)}</span>
        </div>
        <svg viewBox="0 0 ${w} ${h}" class="spark" role="img" aria-label="Close price history for ${symbol}">
          <polyline points="${points}" fill="none" stroke="${up ? "#0e9f6e" : "#dc2626"}" stroke-width="2"/>
        </svg>`;
    }

    watchlistBody.addEventListener("click", async (e) => {
      const chartBtn = e.target.closest(".symbol-btn");
      if (chartBtn) {
        await toggleHistory(chartBtn.dataset.symbol);
        return;
      }
      const btn = e.target.closest(".delete-btn");
      if (!btn) return;
      const symbol = btn.dataset.symbol;
      if (!window.confirm(`Remove ${symbol} from your watchlist?`)) return;
      btn.disabled = true;
      try {
        const resp = await fetch(`/watchlist/${encodeURIComponent(symbol)}`, { method: "DELETE" });
        const data = await resp.json();
        if (!resp.ok) {
          setResult("Error removing " + symbol + ": " + (data.error || resp.statusText), "error");
          btn.disabled = false;
          return;
        }
        setResult("Removed " + symbol, "success");
        loadWatchlist();
      } catch (err) {
        setResult("Request failed: " + err, "error");
        btn.disabled = false;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      setResult("Adding to watchlist...", "info");

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          setResult("Error: " + (data.error || resp.statusText), "error");
          return;
        }
        setResult("Added " + data.symbol + " at price " + data.latest_price, "success");
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        setResult("Request failed: " + err, "error");
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
